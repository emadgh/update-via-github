[package]
name = "update-via-github"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Shared Windows self-updater for applications distributed through GitHub Releases"
license = "MIT"
repository = "https://github.com/emadgh/update-via-github"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
windows-sys = { version = "0.61.2", features = ["Win32_Networking_WinHttp"] }
